name: Build Submission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package release JAR
        run: mvn -B package -DskipTests

      - name: Generate JavaDocs
        run: mvn -B javadoc:javadoc

      - name: Stage submission base
        run: |
          stage=submission/ShareSpace
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)

          mkdir -p "$stage"
          git archive --format=zip --prefix=repo/ -o "$stage/repo.zip" HEAD
          cp -r doc "$stage/doc"
          cp -r target/reports/apidocs "$stage/javadoc"
          cp target/ShareSpace-${version}.jar "$stage/"

      - name: Upload submission base
        uses: actions/upload-artifact@v7
        with:
          name: submission-base
          path: submission/ShareSpace
          retention-days: 7

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build native app-image (jpackage)
        shell: bash
        run: |
          mvn -B clean package -DskipTests
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          jar=$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*' | head -n1)
          if [[ -z "$jar" ]]; then echo "No shaded JAR found in target/" >&2; exit 1; fi
          rm -rf jpackage-input dist
          mkdir -p jpackage-input
          cp "$jar" jpackage-input/
          jpackage --type app-image --input jpackage-input --main-jar "$(basename "$jar")" \
            --main-class app.Main --name ShareSpace --app-version "$version" --dest dist

      - name: Upload ${{ matrix.label }} app-image
        uses: actions/upload-artifact@v7
        with:
          name: app-image-${{ matrix.label }}
          path: dist/ShareSpace
          retention-days: 7

  submission:
    needs: [ build, native ]
    runs-on: ubuntu-latest
    steps:
      - name: Download submission base
        uses: actions/download-artifact@v7
        with:
          name: submission-base
          path: submission/ShareSpace

      - name: Download Linux app-image
        uses: actions/download-artifact@v7
        with:
          name: app-image-linux
          path: submission/ShareSpace/app/linux

      - name: Download Windows app-image
        uses: actions/download-artifact@v7
        with:
          name: app-image-windows
          path: submission/ShareSpace/app/windows

      - name: Unpack source into browsable tree
        run: |
          unzip -q submission/ShareSpace/repo.zip -d submission/ShareSpace
          rm submission/ShareSpace/repo.zip

      - name: Upload submission package
        uses: actions/upload-artifact@v7
        with:
          name: ShareSpace-submission
          path: submission
          include-hidden-files: true

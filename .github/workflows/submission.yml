name: Build Submission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_version: ${{ steps.project_version.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate JavaDocs
        run: mvn -B javadoc:javadoc

      - name: Resolve project version
        id: project_version
        run: |
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ -z "$version" ]]; then echo "Could not resolve project version" >&2; exit 1; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Stage submission base
        run: |
          stage=submission/ShareSpace

          mkdir -p "$stage"
          git archive --format=zip --prefix=repo/ -o "$stage/repo.zip" HEAD
          cp -r doc "$stage/doc"
          cp -r target/reports/apidocs "$stage/javadoc"

      - name: Upload submission base
        uses: actions/upload-artifact@v7
        with:
          name: submission-base
          path: submission/ShareSpace
          retention-days: 7

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build runnable JAR
        shell: bash
        run: |
          mvn -B clean package -DskipTests

      - name: Build native app-image (jpackage)
        if: matrix.label != 'macos-arm64'
        shell: bash
        run: |
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)

          numeric_version=$(echo "$version" | grep -oE '[0-9]+(\.[0-9]+){0,2}' | head -n1)
          if [[ -z "$numeric_version" ]]; then
            app_version="1.0.0"
          else
            IFS='.' read -r major minor patch <<< "$numeric_version"
            major=${major:-1}
            minor=${minor:-0}
            patch=${patch:-0}
            if (( major < 1 )); then
              major=1
            fi
            app_version="${major}.${minor}.${patch}"
          fi
          jar=$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*' | head -n1)
          if [[ -z "$jar" ]]; then echo "No shaded JAR found in target/" >&2; exit 1; fi
          rm -rf jpackage-input dist
          mkdir -p jpackage-input
          cp "$jar" jpackage-input/
          jpackage --type app-image --input jpackage-input --main-jar "$(basename "$jar")" \
            --main-class app.Main --name ShareSpace --app-version "$app_version" --dest dist

      - name: Upload ${{ matrix.label }} runnable JAR
        uses: actions/upload-artifact@v7
        with:
          name: runnable-jar-${{ matrix.label }}
          path: |
            target/*.jar
            !target/original-*.jar
          retention-days: 7

      - name: Upload ${{ matrix.label }} app-image
        if: matrix.label != 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: app-image-${{ matrix.label }}
          path: dist/ShareSpace*
          retention-days: 7

  submission:
    needs: [ build, native ]
    runs-on: ubuntu-latest
    steps:
      - name: Download submission base
        uses: actions/download-artifact@v7
        with:
          name: submission-base
          path: submission/ShareSpace

      - name: Download Linux app-image
        uses: actions/download-artifact@v7
        with:
          name: app-image-linux
          path: submission/ShareSpace/app/linux

      - name: Download Windows app-image
        uses: actions/download-artifact@v7
        with:
          name: app-image-windows
          path: submission/ShareSpace/app/windows

      - name: Download Linux runnable JAR
        uses: actions/download-artifact@v7
        with:
          name: runnable-jar-linux
          path: submission/ShareSpace/jar/linux

      - name: Download Windows runnable JAR
        uses: actions/download-artifact@v7
        with:
          name: runnable-jar-windows
          path: submission/ShareSpace/jar/windows

      - name: Download macOS runnable JAR
        uses: actions/download-artifact@v7
        with:
          name: runnable-jar-macos-arm64
          path: submission/ShareSpace/jar/macos-arm64

      - name: Stage platform-specific runnable JARs
        run: |
          for jar in submission/ShareSpace/jar/linux/*.jar; do
            cp "$jar" "submission/ShareSpace/$(basename "${jar%.jar}")-linux.jar"
          done
          for jar in submission/ShareSpace/jar/windows/*.jar; do
            cp "$jar" "submission/ShareSpace/$(basename "${jar%.jar}")-windows.jar"
          done
          for jar in submission/ShareSpace/jar/macos-arm64/*.jar; do
            cp "$jar" "submission/ShareSpace/$(basename "${jar%.jar}")-macos-arm64.jar"
          done
          rm -rf submission/ShareSpace/jar

      - name: Unpack source into browsable tree
        run: |
          unzip -q submission/ShareSpace/repo.zip -d submission/ShareSpace
          rm submission/ShareSpace/repo.zip

      - name: Upload submission package
        uses: actions/upload-artifact@v7
        with:
          name: ShareSpace-submission-${{ needs.build.outputs.project_version }}
          path: submission
          include-hidden-files: true
